# Conventional prefixes so the labeler and release notes pick these PRs up:
# ci(deps) -> build label, build(deps) -> build label.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      npm-minor:
        update-types: [minor, patch]
