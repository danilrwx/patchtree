name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AMO_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch pinned binary assets
        run: make deps

      - name: Build extension zips
        run: make zip zip-firefox

      - name: Checksums
        run: shasum -a 256 patchtree.zip patchtree-firefox.zip | tee checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: patchtree
          path: |
            patchtree.zip
            patchtree-firefox.zip

      - name: Sign for Firefox (AMO, unlisted)
        if: startsWith(github.ref, 'refs/tags/v') && env.AMO_ISSUER != ''
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npx web-ext sign --channel unlisted --source-dir build/firefox --artifacts-dir signed && cp signed/*.xpi patchtree-firefox.xpi

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            patchtree.zip
            patchtree-firefox.zip
            patchtree-firefox.xpi
            checksums.txt
          generate_release_notes: true
