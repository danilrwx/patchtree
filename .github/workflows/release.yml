name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

# a newer push to the same branch supersedes the running build; tag builds
# publish releases, so those always run to completion
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # full history: the changelog test inside make coverage walks git log
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Lint + license headers + types
        run: make lint typecheck
      # enforces the coverage floor the README badge claims
      - name: Unit coverage
        run: make coverage

  build:
    runs-on: ubuntu-latest
    env:
      AMO_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache pinned binary assets
        uses: actions/cache@v6
        with:
          path: |
            assets/vendor
            assets/fonts
            assets/queries
            assets/themes.json
          # keyed on the fetch scripts, which pin every upstream version —
          # a version bump changes the hash and refreshes the cache
          key: assets-${{ hashFiles('scripts/fetch-vendor.sh', 'scripts/fetch-queries.sh', 'scripts/fetch-fonts.sh', 'scripts/fetch-themes.sh') }}

      - name: Fetch pinned binary assets
        run: make deps

      - name: Test
        run: make test

      - name: Build extension zips
        run: make zip zip-firefox

      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # browsers restored from cache still need the host libraries
      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: End-to-end tests
        run: make e2e

      - name: Upload e2e failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Checksums
        run: cd build && shasum -a 256 patchtree.zip patchtree-firefox.zip | tee checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: patchtree
          path: |
            build/patchtree.zip
            build/patchtree-firefox.zip

      # AMO release notes stay commit-based (changelog.sh); the GitHub release
      # body is generated from merged PRs per .github/release.yml, so each
      # line carries its PR link and author.
      - name: Changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/changelog.sh "${GITHUB_REF_NAME}" > RELEASE_NOTES.md

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/patchtree.zip
            build/patchtree-firefox.zip
            build/checksums.txt
          generate_release_notes: true

      # submits the version for review on the public AMO listing and returns
      # immediately (--approval-timeout 0): a signed xpi only exists after a
      # reviewer approves, so Firefox distribution happens through AMO itself.
      # Runs after the GitHub release so an AMO-side rejection never withholds
      # the Chrome artifacts.
      - name: Submit to AMO (listed)
        if: startsWith(github.ref, 'refs/tags/v') && env.AMO_ISSUER != ''
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          # reviewers need the unbundled sources plus how to rebuild dist/
          git archive --format=zip -o amo-source.zip HEAD
          sed -e "s|@TAG@|${GITHUB_REF_NAME}|" -e "s|@SHA@|${GITHUB_SHA}|" \
            .github/amo-reviewer-notes.txt > amo-notes.txt
          # the first listed publish must carry add-on level fields the
          # Developer Hub has no form for yet (categories); AMO keeps them
          jq -n --rawfile notes RELEASE_NOTES.md --rawfile reviewer amo-notes.txt \
            '{
               categories: ["web-development"],
               version: {
                 license: "Apache-2.0",
                 approval_notes: $reviewer,
                 release_notes: {"en-US": $notes}
               }
             }' > amo-metadata.json
          npx web-ext sign --channel listed --approval-timeout 0 \
            --amo-metadata amo-metadata.json \
            --upload-source-code amo-source.zip \
            --source-dir build/firefox --artifacts-dir signed
