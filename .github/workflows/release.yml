name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Lint + license headers + types
        run: make lint typecheck

  build:
    runs-on: ubuntu-latest
    env:
      AMO_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache pinned binary assets
        uses: actions/cache@v4
        with:
          path: |
            assets/vendor
            assets/fonts
            assets/queries
            assets/themes.json
          # keyed on the fetch scripts, which pin every upstream version —
          # a version bump changes the hash and refreshes the cache
          key: assets-${{ hashFiles('scripts/fetch-vendor.sh', 'scripts/fetch-queries.sh', 'scripts/fetch-fonts.sh', 'scripts/fetch-themes.sh') }}

      - name: Fetch pinned binary assets
        run: make deps

      - name: Test
        run: make test

      - name: Build extension zips
        run: make zip zip-firefox

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: xvfb-run make e2e

      - name: Upload e2e failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Checksums
        run: cd build && shasum -a 256 patchtree.zip patchtree-firefox.zip | tee checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: patchtree
          path: |
            build/patchtree.zip
            build/patchtree-firefox.zip

      - name: Changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/changelog.sh "${GITHUB_REF_NAME}" > RELEASE_NOTES.md

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/patchtree.zip
            build/patchtree-firefox.zip
            build/checksums.txt
          body_path: RELEASE_NOTES.md

      # submits the version for review on the public AMO listing and returns
      # immediately (--approval-timeout 0): a signed xpi only exists after a
      # reviewer approves, so Firefox distribution happens through AMO itself.
      # Runs after the GitHub release so an AMO-side rejection never withholds
      # the Chrome artifacts.
      - name: Submit to AMO (listed)
        if: startsWith(github.ref, 'refs/tags/v') && env.AMO_ISSUER != ''
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          # listed submissions need add-on level metadata too (categories,
          # summary, license); AMO keeps them once set, so this only really
          # matters for the first publish
          jq -n --rawfile notes RELEASE_NOTES.md \
            '{
               categories: ["web-development"],
               summary: {"en-US": "Turn raw .diff/.patch URLs into a full code review UI: tree-sitter highlighting, file tree, inline comments and reviews for GitLab and GitHub."},
               version: {license: "Apache-2.0", release_notes: {"en-US": $notes}}
             }' > amo-metadata.json
          npx web-ext sign --channel listed --approval-timeout 0 \
            --amo-metadata amo-metadata.json \
            --source-dir build/firefox --artifacts-dir signed
