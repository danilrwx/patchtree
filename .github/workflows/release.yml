name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tooling
        run: python3 -m pip install fonttools brotli

      - name: Fetch pinned binary assets
        run: make deps

      - name: Build extension zip
        run: make zip

      - name: Checksums
        run: shasum -a 256 patchtree.zip | tee checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: patchtree
          path: patchtree.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            patchtree.zip
            checksums.txt
          generate_release_notes: true
