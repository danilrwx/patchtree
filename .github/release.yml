changelog:
  categories:
    - title: 🚀 Features
      labels: [feature]
    - title: 🐛 Fixes
      labels: [fix]
    - title: ⚡ Performance
      labels: [performance]
    - title: ♻️ Refactoring
      labels: [refactor]
    - title: 📖 Documentation
      labels: [documentation]
    - title: ✅ Tests
      labels: [test]
    - title: 👷 Build & CI
      labels: [build]
    - title: 🔧 Chores
      labels: [chore]
    - title: Other
      labels: ["*"]
  exclude:
    labels: [skip-changelog]
